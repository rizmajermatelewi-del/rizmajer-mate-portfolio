    <!-- Fonts are self-hosted in /public/fonts and declared in src/fonts.css.
         No font CDN at runtime: Fontshare silently served a "temporarily
         restricted" comment instead of CSS, which dropped body text to a
         fallback with no error, and self-hosting also sidesteps the Google
         Fonts GDPR question for EU visitors. -->
    <link rel="preload" href="/fonts/geist-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist-600-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Structured data. A ld+json block is a CSP "data block", not an
         executable script, so script-src 'self' does not block it and no
         'unsafe-inline' is needed. Only verifiable facts go in here: no
         address, phone, priceRange, rating or founding date, because
         schema.org markup that contradicts the page is worse than none —
         search engines treat it as a spam signal, not a bonus. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Person",
          "@id": "https://rizmajer-mate-portfolio.vercel.app/#person",
          "name": "Rizmajer Máté",
          "jobTitle": "Full-stack fejlesztő",
          "email": "rizmajermatelewi@gmail.com",
          "telephone": "+36301314353",
          "url": "https://rizmajer-mate-portfolio.vercel.app/",
          "sameAs": [
            "https://github.com/rizmajermatelewi-del",
            "https://www.linkedin.com/in/rizmajer-mate/"
          ],
          "address": {
            "@type": "PostalAddress",
            "addressCountry": "HU"
          },
          "knowsLanguage": ["hu", "en"],
          "knowsAbout": [
            "Webfejlesztés",
            "React",
            "Node.js",
            "Időpontfoglaló rendszerek",
            "Online rendelési rendszerek",
            "Egyedi ügyviteli rendszerek"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://rizmajer-mate-portfolio.vercel.app/#website",
          "url": "https://rizmajer-mate-portfolio.vercel.app/",
          "name": "Rizmajer Máté — Full-Stack Fejlesztő",
          "inLanguage": "hu-HU",
          "publisher": { "@id": "https://rizmajer-mate-portfolio.vercel.app/#person" }
        },
        {
          "@type": "FAQPage",
          "@id": "https://rizmajer-mate-portfolio.vercel.app/#faq",
          "inLanguage": "hu-HU",
          "isPartOf": { "@id": "https://rizmajer-mate-portfolio.vercel.app/#website" },
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Mennyibe kerül egy weboldal?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Egy bemutatkozó oldal 180 000 Ft-tól, egy foglalási vagy rendelési rendszer 450 000 Ft-tól, egy belső rendszer 1 200 000 Ft-tól indul. Ezek indulóárak: a pontosat egy rövid egyeztetés után, írásban és tételesen kapod meg, és utólag nem jön hozzá semmi."
              }
            },
            {
              "@type": "Question",
              "name": "Mi kerül még pénzbe a fejlesztésen túl?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "A domain és a tárhely éves díja. Ezek nem nálam futnak, hanem a te nevedre regisztráljuk, így pontosan látod, mit fizetsz és kinek. Ezen felül csak akkor van további költség, ha kérsz karbantartást vagy új funkciót. Az ajánlatban ezt előre tételesen leírom."
              }
            },
            {
              "@type": "Question",
              "name": "WordPress vagy egyedi fejlesztés legyen?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Attól függ, mit csinál az oldal. Ha bemutatkozásról és néhány aloldalról van szó, egy kész rendszer olcsóbb és gyorsabb. Ha viszont foglalni, rendelni vagy belső folyamatot kezelni kell, ott a kész bővítmények általában vagy nem azt tudják, ami kell, vagy havidíjasak. Az első egyeztetésen megmondom, melyik éri meg neked."
              }
            },
            {
              "@type": "Question",
              "name": "Mennyi idő alatt készül el?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Egy egyoldalas bemutatkozó jellemzően 1-2 hét, egy egyedi funkciókkal bíró webalkalmazás 3-6 hét. A pontos ütemezést az első egyeztetésen rögzítjük, és tartom is."
              }
            },
            {
              "@type": "Question",
              "name": "Mi történik, ha nem tetszik, amit csinálsz?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Nem a végén látod először. Menet közben folyamatosan megmutatom, hol tart, így a korrekció olcsó marad. Az egyeztetési körök számát és a félbeszakadás feltételeit az ajánlatban rögzítjük, hogy egyikünket se érje meglepetés."
              }
            },
            {
              "@type": "Question",
              "name": "Ki tartja karban az oldalt utána?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Ahogy megbeszéljük. Az oldalt úgy építem, hogy a tartalmat magad is tudd kezelni, és az átadáskor megmutatom, hogyan. Ha inkább rám bíznád, az üzemeltetés 25 000 Ft/hó: frissítések, biztonsági mentés, havi egy óra apró módosítás, és ha leáll, én veszem észre, nem te. Nincs hűségidő, hónapra felmondható. Ha nem kéred, akkor sem tűnök el: kérdésre és hibára egy munkanapon belül válaszolok, ez nem havidíjas."
              }
            },
            {
              "@type": "Question",
              "name": "Mobilon is jól fog működni?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Igen, és ezt nem utólag ragasztom rá. A látogatók nagyobb része telefonon érkezik, ezért a mobil nézet ugyanolyan súllyal készül, mint az asztali. Ide tartozik az is, hogy billentyűzettel és képernyőolvasóval is használható legyen."
              }
            },
            {
              "@type": "Question",
              "name": "Kié lesz a kód és a domain?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "A tiéd. A forráskódot átadom, a domaint és a tárhelyet a te nevedre regisztráljuk, így nem kerülsz függő helyzetbe, és bármikor tovább tudsz lépni máshoz."
              }
            }
          ]
        }
      ]
    }
