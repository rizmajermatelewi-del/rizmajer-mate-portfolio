<!doctype html>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG, and not because SVG is unfashionable: iOS does not read an SVG
         for a home-screen icon at all, so without this the bookmark gets a
         screenshot of the page. Rendered at 180 from the same mark as the
         favicon, square and unrounded, because iOS applies its own mask and a
         pre-rounded square shows dark corners inside it. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Matches --color-deep, not the page background. It tints the browser
         chrome on Android, and the top of every route on this site is the dark
         hero or a dark header rather than the light page below it. -->
    <meta name="theme-color" content="#0b1421" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- This pair is the Hungarian side of HOME_META in src/i18n/meta.js, and
         prerender.mjs fails the build if the two ever disagree. It is here for

    <!-- Twitter falls back to og:image:alt when this is absent, but only on some

    <!-- Fonts are self-hosted in /public/fonts and declared in src/fonts.css.
         No font CDN at runtime: Fontshare silently served a "temporarily
         restricted" comment instead of CSS, which dropped body text to a
         fallback with no error, and self-hosting also sidesteps the Google
         Fonts GDPR question for EU visitors. -->
    <link rel="preload" href="/fonts/geist-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist-600-latin.woff2" as="font" type="font/woff2" crossorigin />

         search engines treat it as a spam signal, not a bonus. -->

  <body>
    <!-- The loading cover.

         It lives here, outside #root, and that placement is the whole design
         rather than a detail. The gap being covered is the wait for the React
         bundle: main.jsx uses createRoot, so when the bundle finally runs it
         discards the prerendered markup and renders again from scratch, and
         GSAP then pulls the hero lines back to opacity 0 to animate them in.
         A cover rendered by React cannot hide React's own arrival. Sitting in
         the template means it is painted with the first frame the browser
         produces, and React's re-render never touches it.

         Measured before this existed, on Slow 4G with a 4x CPU throttle: LCP
         2122ms, of which 2116ms was render delay. The cover does not change
         that number — it changes what fills those two seconds.

         No text, and that is a build constraint as well as a design one.
         prerender.mjs scans the whole finished /en page for Hungarian and
         fails the build on a hit, so a Hungarian loading word here would
         break every English route. That check reads raw markup, comments
         included — this note originally spelled the word out as an example
         and failed the build on itself, which is the guard behaving exactly
         as intended. The cover is decorative, so aria-hidden keeps it out of
         the accessibility tree entirely and there is nothing to translate.

         Removed by src/preloader.js once React has painted and the hero image
         has decoded. If that never happens — a failed bundle, JS disabled, a
         thrown module — the CSS failsafe in index.css hides it anyway. A
         loading screen that can outlive its own script is not a slow site, it
         is an unreachable one. -->
    <div id="preloader" aria-hidden="true"><span class="preloader-mark"></span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
