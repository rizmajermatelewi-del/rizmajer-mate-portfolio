<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG, and not because SVG is unfashionable: iOS does not read an SVG
         for a home-screen icon at all, so without this the bookmark gets a
         screenshot of the page. Rendered at 180 from the same mark as the
         favicon, square and unrounded, because iOS applies its own mask and a
         pre-rounded square shows dark corners inside it. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Matches --color-deep, not the page background. It tints the browser
         chrome on Android, and the top of every route on this site is the dark
         hero or a dark header rather than the light page below it. -->
    <meta name="theme-color" content="#0b1421" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- This pair is the Hungarian side of HOME_META in src/i18n/meta.js, and
         prerender.mjs fails the build if the two ever disagree. It is here for
         the dev server and for anything reading the template before the
         prerender step; meta.js is the source. -->
    <meta name="description" content="Weboldal készítés, időpontfoglaló és rendelési rendszerek kisvállalkozásoknak Pest megyében és Budapesten. Kevesebb kézi adminisztráció, előre rögzített ár." />
    <title>Weboldal készítés KKV-knak, Pest megye, Budapest | Rizmajer Máté</title>
    <link rel="canonical" href="https://rizmajer-mate-portfolio.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rizmajer Máté Levente" />
    <meta property="og:locale" content="hu_HU" />
    <meta property="og:url" content="https://rizmajer-mate-portfolio.vercel.app/" />
    <meta property="og:title" content="Weboldal készítés KKV-knak, Pest megye, Budapest | Rizmajer Máté" />
    <meta property="og:description" content="Weboldalak, foglalási, rendelési és belső rendszerek kis- és középvállalkozásoknak, kevesebb kézi adminisztrációval." />
    <meta property="og:image" content="https://rizmajer-mate-portfolio.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rizmajer Máté Levente | full-stack fejlesztő portfólió" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Weboldal készítés KKV-knak, Pest megye, Budapest | Rizmajer Máté" />
    <meta name="twitter:description" content="Weboldalak, foglalási, rendelési és belső rendszerek kis- és középvállalkozásoknak, kevesebb kézi adminisztrációval." />
    <meta name="twitter:image" content="https://rizmajer-mate-portfolio.vercel.app/og-image.jpg" />
    <!-- Twitter falls back to og:image:alt when this is absent, but only on some
         surfaces. Stating it here means the card is described everywhere, and it
         is kept identical to og:image:alt above so the two cannot drift. -->
    <meta name="twitter:image:alt" content="Rizmajer Máté Levente | full-stack fejlesztő portfólió" />

    <!-- Fonts are self-hosted in /public/fonts and declared in src/fonts.css.
         No font CDN at runtime: Fontshare silently served a "temporarily
         restricted" comment instead of CSS, which dropped body text to a
         fallback with no error, and self-hosting also sidesteps the Google
         Fonts GDPR question for EU visitors. -->
    <link rel="preload" href="/fonts/geist-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist-600-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Structured data. A ld+json block is a CSP "data block", not an
         executable script, so script-src 'self' does not block it and no
         'unsafe-inline' is needed. Only verifiable facts go in here: no
         address, phone, priceRange, rating or founding date, because
         schema.org markup that contradicts the page is worse than none —
         search engines treat it as a spam signal, not a bonus. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Person",
          "@id": "https://rizmajer-mate-portfolio.vercel.app/#person",
          "name": "Rizmajer Máté Levente",
          "jobTitle": "Full-stack fejlesztő",
          "email": "info@rizmajerdev.com",
          "telephone": "+36301314353",
          "url": "https://rizmajer-mate-portfolio.vercel.app/",
          "sameAs": [
            "https://github.com/rizmajermatelewi-del",
            "https://www.linkedin.com/in/rizmajer-mate/"
          ],
          "address": {
            "@type": "PostalAddress",
            "addressCountry": "HU"
          },
          "knowsLanguage": ["hu", "en"],
          "knowsAbout": [
            "Webfejlesztés",
            "React",
            "Node.js",
            "Időpontfoglaló rendszerek",
            "Online rendelési rendszerek",
            "Egyedi ügyviteli rendszerek"
          ]
        },
        {
          "@type": "ProfessionalService",
          "@id": "https://rizmajer-mate-portfolio.vercel.app/#business",
          "name": "Rizmajer Máté Levente",
          "url": "https://rizmajer-mate-portfolio.vercel.app/",
          "image": "https://rizmajer-mate-portfolio.vercel.app/og-image.jpg",
          "email": "info@rizmajerdev.com",
          "telephone": "+36301314353",
          "inLanguage": "hu-HU",
          "founder": { "@id": "https://rizmajer-mate-portfolio.vercel.app/#person" },
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Inárcs",
            "addressCountry": "HU"
          },
          "areaServed": [
            { "@type": "AdministrativeArea", "name": "Pest vármegye" },
            { "@type": "City", "name": "Budapest" },
            { "@type": "Country", "name": "Magyarország" }
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://rizmajer-mate-portfolio.vercel.app/#website",
          "url": "https://rizmajer-mate-portfolio.vercel.app/",
          "name": "Rizmajer Máté Levente, full-stack fejlesztő",
          "inLanguage": "hu-HU",
          "publisher": { "@id": "https://rizmajer-mate-portfolio.vercel.app/#person" }
        },
        {
          "@type": "FAQPage",
          "@id": "https://rizmajer-mate-portfolio.vercel.app/#faq",
          "inLanguage": "hu-HU",
          "isPartOf": { "@id": "https://rizmajer-mate-portfolio.vercel.app/#website" },
          "mainEntity": []
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
