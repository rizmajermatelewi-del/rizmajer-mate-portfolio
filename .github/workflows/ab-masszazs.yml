# Runs only when the AB Masszázs app (client property, nested until repo split) changes.
name: ab-masszazs

on:
  push:
    paths:
      - 'ab-masszazs/**'
      - '.github/workflows/ab-masszazs.yml'
  pull_request:
    paths:
      - 'ab-masszazs/**'
      - '.github/workflows/ab-masszazs.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ab-masszazs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ab-masszazs/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx oxlint
